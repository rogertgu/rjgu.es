name: Validar y desplegar en GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Rehace la web para publicar las páginas de los episodios nuevos del podcast
  # (sale a las 07:00 de Madrid). El cron de GitHub puede llegar con horas de
  # retraso, por eso hay dos pasadas. repository_dispatch (tipo podcast-published)
  # queda listo para que el pipeline del podcast lo dispare al publicar.
  schedule:
    - cron: '30 6 * * 1-5'
    - cron: '30 12 * * 1-5'
  repository_dispatch:
    types: [ podcast-published ]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Prueba en navegador un _site/ construido con el podcast de tests/fixtures y
  # después construye y valida el _site/ real (episodios del bucket), que es el
  # que se sube como artefacto de Pages en main.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Dependencias
      run: npm ci

    - name: Navegador para las pruebas
      run: npx playwright install --with-deps chromium

    - name: Pruebas en navegador (podcast de prueba)
      run: npm test

    - name: Informe de las pruebas
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Validación estática (construye el _site/ real)
      run: npm run validate

    - name: Validación HTML
      run: npm run lint:html

    - name: Configurar Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5

    - name: Subir _site/ como artefacto de Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
