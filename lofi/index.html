      background: lines ? `repeating-linear-gradient(to bottom, transparent 0 ${px - 1 / dpr}px, rgba(0,0,0,.16) ${px - 1 / dpr}px ${px}px)` : "none"
    });
  }
  addEventListener("resize", layout);
  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(document.getElementById("player"));
  on("settings", ({ key: key4 }) => {
    if (key4 === "fit") layout();
  });
  layout();

  // src/ui/pwa.js
  var BUILD = document.documentElement.dataset.build;
  if (BUILD && /^https?:$/.test(location.protocol)) {
    const link = (rel, href) => {
      const l = document.createElement("link");
      l.rel = rel;
      l.href = href;
      document.head.appendChild(l);
    };
    link("manifest", "manifest.webmanifest");
    link("apple-touch-icon", "apple-touch-icon.png");
    if ("serviceWorker" in navigator) {
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").catch(() => {
      });
      if (KIOSK2 && had) navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
    }
  }

  // src/ui/controls.js
  if (Q.get("shot") === "1") document.body.classList.add("shot");
  var fsBtn = document.getElementById("fs");
  var hint = document.getElementById("hint");
  var D = document;
  var EL = D.documentElement;
  var isFS = () => !!(D.fullscreenElement || D.webkitFullscreenElement);
  function toggleFS() {
    if (!isFS()) {
      const req = EL.requestFullscreen || EL.webkitRequestFullscreen;
      if (req) Promise.resolve(req.call(EL)).catch(() => {
      });
    } else {
      const ex = D.exitFullscreen || D.webkitExitFullscreen;
      if (ex) ex.call(D);
    }
  }
  if (!(D.fullscreenEnabled || D.webkitFullscreenEnabled)) fsBtn.style.display = "none";
  fsBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleFS();
  });
  var fsLabel = () => {
    fsBtn.textContent = isFS() ? "SALIR DE PANTALLA COMPLETA" : "PANTALLA COMPLETA";
    layout();
  };
  D.addEventListener("fullscreenchange", fsLabel);
  D.addEventListener("webkitfullscreenchange", fsLabel);
  var uiHide = 0;
  var busy2 = () => !listEl.hidden || !panelEl.hidden || playerEl.matches(":hover, :focus-within");
  var hideUI = () => {
    if (busy2()) {
      uiHide = setTimeout(hideUI, 1e3);
      return;
    }
    fsBtn.classList.add("hide");
    playerEl.classList.add("hide");
  };
  function pokeUI() {
    fsBtn.classList.remove("hide");
    playerEl.classList.remove("hide");
    clearTimeout(uiHide);
    uiHide = setTimeout(hideUI, KIOSK2 ? 6e3 : 3e3);
  }
  (KIOSK2 ? ["pointerdown", "touchstart", "keydown"] : ["mousemove", "pointerdown", "touchstart", "keydown"]).forEach((ev) => addEventListener(ev, pokeUI, { passive: true }));
  if (KIOSK2) hideUI();
  else pokeUI();
  var start3 = unlockAudio;
  ["pointerdown", "pointerup", "touchend"].forEach((ev) => addEventListener(ev, start3, { passive: true }));
  var hintDone = KIOSK2;
  if (KIOSK2) hint.style.opacity = 0;
  on("radio", () => {
    if (started && !hintDone) {
      hintDone = true;
      hint.style.opacity = 0;
    }
  });
  addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase(), onCtl = /^(BUTTON|INPUT)$/.test(e.target.tagName);
    if (e.target.type === "number" && k !== "escape") return;
    if (k === " " && onCtl) return;
    if (k !== " ") start3();
    const keys = {
      " ": togglePlay,
      n: nextTrack,
      arrowright: nextTrack,
      b: prevTrack,
      arrowleft: prevTrack,
      l: () => toggleList(),
      s: toggleShuffle,
      r: toggleRain,
      t: () => {
        if (settings.pomoOn) togglePomo();
      },
      m: toggleMute,
      f: toggleFS,
      "+": () => setVol(vol + 0.05),
      "=": () => setVol(vol + 0.05),
      "-": () => setVol(vol - 0.05),
      a: () => toggleSettings(),
      z: cycleSleep,
      h: () => {
        hint.style.opacity = hint.style.opacity === "0" ? 1 : 0;
      },
      escape: () => {
        toggleList(false);
        toggleSettings(false);
      }
    };
    if (onCtl && k.startsWith("arrow")) return;
    if (keys[k]) {
      e.preventDefault();
      keys[k]();
    }
  });

  // src/main.js
  var FF_MAX = 48 * 60;
  var FF_CHUNK = 3e3;
  var trace = [];
  var outside3 = [];
  var errors = [];
  var lastSample = -1;
  if (DEBUG) {
    window.__hl = { rog, tars, cats, seed, weather, homelab, trace, outside: outside3, errors, get hour() {
      return hour();
    }, get MIN() {
      return MIN;
    } };
    addEventListener("error", (e) => errors.push(String(e.message)));
    addEventListener("unhandledrejection", (e) => errors.push(String(e.reason)));
  }
  function step2() {
    tick();
    if (door.t > 0) door.t -= DT;
    tickActors();
    tickWorld();
    if (DEBUG) probe2();
  }
  log("BUENOS DIAS DESDE EL HOMELAB", GREEN);
  var acc = 0;
  var last2 = 0;
  function frame(now2) {
    acc += Math.min(0.25, (now2 - last2) / 1e3);
    last2 = now2;
    let stepped = false;
    while (acc >= DT) {
      step2();
      acc -= DT;
      stepped = true;
    }
    if (stepped) render();
    if (DEBUG && stepped) publish();
    requestAnimationFrame(frame);
  }
  function start4() {
    render();
    if (DEBUG) publish();
    if (STILL) return;
    last2 = performance.now();
    requestAnimationFrame(frame);
  }
  var left = settings.realtime ? 0 : Math.round(Math.min(FF, FF_MAX) / minPerTick());
  (function fastForward() {
    for (let n2 = Math.min(left, FF_CHUNK); n2 > 0; n2--) step2();
    left -= Math.min(left, FF_CHUNK);
    if (left > 0) setTimeout(fastForward, 0);
    else start4();
  })();
  function probe2() {
    for (const a of [["rog", rog], ["tars", tars], ...cats.map((c) => [c.kind, c])])
      if (a[1].visible && (a[1].x < WALK.min - 0.5 || a[1].x > WALK.max + 0.5) && outside3.length < 50)
        outside3.push({ who: a[0], x: +a[1].x.toFixed(1), h: +hour().toFixed(2) });
    const s = Math.floor(MIN / 15);
    if (s === lastSample || trace.length >= 400) return;
    lastSample = s;
    trace.push({
      h: +hour().toFixed(2),
      rog: rog.state,
      nap: rog.napping,
      rx: +rog.x.toFixed(1),
      act: rog.activity,
      tars: tars.charging ? "charge" : "up",
      tx: +tars.x.toFixed(1),
      cats: cats.map((c) => +c.x.toFixed(1))
    });
  }
  function publish() {
    const out = {
      seed,
      speed: settings.speed,
      MIN: +MIN.toFixed(2),
      hour: +hour().toFixed(3),
      F,
      rog: { state: rog.state, x: rog.x, napping: rog.napping, activity: rog.activity },
      tars: { x: tars.x, charging: tars.charging },
      cats: cats.map((c) => ({ kind: c.kind, x: c.x, pose: c.pose })),
      trace,
      outside: outside3,
      errors
    };
    let el = document.getElementById("hl-debug");
    if (!el) {
      el = document.createElement("script");
      el.type = "application/json";
      el.id = "hl-debug";
      document.body.appendChild(el);
    }
    el.textContent = JSON.stringify(out).replace(/</g, "\\u003c");
    document.title = `HL seed=${seed} h=${out.hour} rog=${rog.state} tars=${out.tars.charging ? "charge" : "up"}`;
  }
})();
</script>
</body>
</html>
